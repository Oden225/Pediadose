name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Prepare www folder
        run: |
          mkdir -p www
          cp index.html sw.js manifest.webmanifest www/ 2>/dev/null || true
          cp -r icon-*.png apple-touch-icon* favicon-32.png maskable-*.png www/ 2>/dev/null || true
          cp -r .well-known www/ 2>/dev/null || true

      - name: Init Capacitor (if not already configured)
        run: |
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            npx cap init pediadose com.pediadose.app --web-dir=www
          fi

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync web assets
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pediadose-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
